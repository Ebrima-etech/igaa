services:
  - type: web
    name: gia-hajj-api
    env: python
    region: oregon
    plan: standard
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn igaa_project.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --worker-class sync --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,gia-hajj-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kanb-seven.vercel.app,https://iga-blush.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: gia-postgresql
          property: connectionString
  - type: pserv
    name: gia-postgresql
    ipAllowList: []
    plan: standard
    region: oregon
    postgresVersion: "15"
